<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-labelledby="title">
  <title id="title">Harinda monogram — an H whose crossbar is an orbit</title>
  <style>
    .draw { stroke-dasharray: 1; animation: draw 1.8s cubic-bezier(.2,.7,.2,1) both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; }
    .orbiter { offset-rotate: 0deg; animation: orbit 36s linear infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .orbiter { animation: none; }
      .orbiter { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="ruleL" x1="0" x2="1">
      <stop offset="0" stop-color="#2A3346" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A3346" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="ruleR" x1="0" x2="1">
      <stop offset="0" stop-color="#2A3346" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2A3346" stop-opacity="0"/>
    </linearGradient>
    <mask id="interlock" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="180">
      <rect width="1200" height="180" fill="#fff"/>
      <rect x="569.03" y="72.96" width="15" height="16" fill="#000"/><rect x="617.02" y="59.25" width="15" height="16" fill="#000"/>
    </mask>
  </defs>
  <rect x="120" y="89.5" width="396" height="1" fill="url(#ruleL)"/>
  <rect x="684" y="89.5" width="396" height="1" fill="url(#ruleR)"/>
  <g fill="none" stroke="#0B0F17" stroke-width="5">
    <path d="M576 56V124M624 56V124"/>
  </g>
  <g mask="url(#interlock)">
    <ellipse cx="600" cy="90" rx="54" ry="17" transform="rotate(-18 600 90)" fill="none" stroke="#3D7BFF" stroke-width="2.5"/>
  </g>
  <circle cx="642.55" cy="67.6" r="5" fill="#3D7BFF"/>
  <circle class="orbiter" r="3.5" fill="#8C7BFF" style="offset-path: path('M651.36 73.31 A54 17 -18 1 1 548.64 106.69 A54 17 -18 1 1 651.36 73.31Z');"/>
</svg>
