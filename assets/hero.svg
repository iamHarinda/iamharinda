<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">HARINDA — Full-stack developer and digital product builder</title>
  <desc id="desc">Custom HARINDA wordmark beside an orbital diagram of three connected nodes labelled interface, system and product.</desc>
  <style>
    .draw { stroke-dasharray: 1; animation: draw 1.8s cubic-bezier(.2,.7,.2,1) both; }
    .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; }
    .orbiter { offset-rotate: 0deg; animation: orbit 48s linear infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .orbiter { animation: none; }
      .orbiter { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFD"/>
      <stop offset="1" stop-color="#EEF1F7"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.8" cy="0.35714285714285715" r=".55">
      <stop offset="0" stop-color="#3D7BFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx=".95" cy=".95" r=".5">
      <stop offset="0" stop-color="#8C7BFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8C7BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0B0F17" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx=".72" cy=".42" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="560" fill="url(#gridFade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="560" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#canvas)"/>
    <rect width="1200" height="560" fill="url(#glowBlue)"/>
    <rect width="1200" height="560" fill="url(#glowViolet)"/>
    <rect width="1200" height="560" fill="url(#grid)" mask="url(#gridMask)"/>
    
  <g fill="none" stroke-width="1.25">
    <ellipse class="draw" pathLength="1" cx="978" cy="250" rx="171.6" ry="60.84" transform="rotate(-16 978 250)" stroke="#2A3346" stroke-opacity="0.16"/>
    <ellipse class="draw d2" pathLength="1" cx="978" cy="250" rx="121.68" ry="43.68" transform="rotate(-16 978 250)" stroke="#2A3346" stroke-opacity="0.26"/>
    <ellipse stroke-dasharray="2 7" cx="978" cy="250" rx="71.76" ry="25.74" transform="rotate(-16 978 250)" stroke="#2A3346" stroke-opacity="0.38"/>
  </g>
  <g stroke="#2A3346" stroke-opacity=".22" stroke-width="1"><line x1="894.11" y1="216.5" x2="969" y2="297.29"/><line x1="969" y1="297.29" x2="1114.72" y2="180.45"/><line x1="894.11" y1="216.5" x2="978" y2="250"/><line x1="1114.72" y1="180.45" x2="978" y2="250"/></g>
  <g>
    <circle cx="978" cy="250" r="12.48" fill="none" stroke="#2A3346" stroke-opacity=".5"/>
    <circle cx="978" cy="250" r="3.5100000000000002" fill="#0B0F17"/>
    <path d="M956.16 250H962.4M993.6 250H999.84M978 228.16V234.4M978 265.6V271.84" stroke="#2A3346" stroke-opacity=".5"/>
    <circle cx="894.11" cy="216.5" r="3.9000000000000004" fill="#0B0F17"/><circle cx="894.11" cy="216.5" r="8.58" fill="none" stroke="#2A3346" stroke-opacity=".35"/>
    <circle cx="969" cy="297.29" r="3.9000000000000004" fill="#3D7BFF"/><circle cx="969" cy="297.29" r="8.58" fill="none" stroke="#2A3346" stroke-opacity=".35"/>
    <circle cx="1114.72" cy="180.45" r="3.9000000000000004" fill="#0B0F17"/><circle cx="1114.72" cy="180.45" r="8.58" fill="none" stroke="#2A3346" stroke-opacity=".35"/>
  </g>
  <circle class="orbiter" r="3.12" fill="#8C7BFF" style="offset-path: path('M1094.97 216.46 A121.68 43.68 -16 1 1 861.03 283.54 A121.68 43.68 -16 1 1 1094.97 216.46Z');"/>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.6" fill="#566074">
    <text x="894.11" y="192.5" text-anchor="middle">01  INTERFACE</text>
    <text x="969" y="331.29" text-anchor="middle">02  SYSTEM</text>
    <text x="1114.72" y="156.45" text-anchor="middle">03  PRODUCT</text>
  </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="559" rx="27.5" fill="none" stroke="#DCE1EA"/>

  <!-- Meta row -->
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2.4" fill="#566074">
    <rect x="80" y="74" width="8" height="8" fill="#3D7BFF"/>
    <text x="102" y="83">IAMHARINDA</text>
    <text x="1120" y="83" text-anchor="end">SRI LANKA</text>
  </g>

  <!-- Wordmark -->
  
  <clipPath id="wm-clip"><rect x="40" y="216" width="760.5999999999999" height="116"/></clipPath>
  <g clip-path="url(#wm-clip)" fill="none" stroke="#0B0F17" stroke-width="14" stroke-linecap="butt" stroke-linejoin="miter"><path transform="translate(80 0)" d="M7 195V353M74.2 195V353M0 274H81.19999999999999"/><path transform="translate(181.24 0)" d="M-8.82 353L48.72 214L106.26 353"/><path transform="translate(299.88 0)" d="M7 195V353M0 223H44.06A27.82 27.82 0 0 1 44.06 278.64H0M33.13 278.64L83.08 353"/><path transform="translate(405.76 0)" d="M7 195V353"/><path transform="translate(446.76 0)" d="M7 195V353M76.52 195V353M2.8 203.4L80.72 344.6"/><path transform="translate(557.28 0)" d="M7 195V353M0 223H27.84A51 51 0 0 1 27.84 325H0"/><path transform="translate(663.16 0)" d="M-8.82 353L48.72 214L106.26 353"/></g>
  <circle cx="229.96" cy="297.2" r="7" fill="#0B0F17"/>
  <circle cx="711.88" cy="297.2" r="7" fill="#3D7BFF"/>

  <!-- Headline -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="78" y="420" font-size="34" font-weight="500" letter-spacing="-.4" fill="#0B0F17">Full-stack developer &amp; digital product builder.</text>
    <text x="79" y="462" font-size="22" letter-spacing="-.1" fill="#566074">Engineering and design, held to the same standard.</text>
  </g>

  <!-- Base row -->
  <path d="M80 500H1120" stroke="#2A3346" stroke-opacity=".14"/>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#566074">
    <text x="80" y="528">WEB  ·  FULL-STACK  ·  SAAS  ·  CREATIVE TECHNOLOGY</text>
    <text x="1120" y="528" text-anchor="end">IAMHARINDA.COM</text>
  </g>
</svg>
